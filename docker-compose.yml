# Full local stack: API + worker + Redis + Postgres.
#
#   docker compose up -d --build
#   ./scripts/smoke_test.sh
#
# Override secrets/limits via a .env file at the repo root (gitignored) or
# by exporting the variables in your shell.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
  REDIS_URL: redis://redis:6379/0
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  WEBHOOK_MAX_TRIES: ${WEBHOOK_MAX_TRIES:-5}
  WEBHOOK_RETRY_BASE_SECONDS: ${WEBHOOK_RETRY_BASE_SECONDS:-30}
  WEBHOOK_RETRY_MAX_SECONDS: ${WEBHOOK_RETRY_MAX_SECONDS:-3600}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
  LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-120000}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  LLM_MAX_FINDINGS: ${LLM_MAX_FINDINGS:-10}
  LLM_MIN_CONFIDENCE: ${LLM_MIN_CONFIDENCE:-0.6}
  LLM_ALLOW_PRIVATE_REPOS: ${LLM_ALLOW_PRIVATE_REPOS:-false}

x-backend-base: &backend-base
  build:
    context: ./backend
  image: ai-code-review-assistant-backend:local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_code_review
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_code_review"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *backend-base
    environment: *backend-env
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *backend-base
    environment: *backend-env
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
